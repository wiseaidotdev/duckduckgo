[package]
name = "duckduckgo"
version = "0.3.3"
authors = ["Mahmoud Harmouch <oss@wiseai.dev>"]
edition = "2024"
description = "🦆 A CLI, TUI, and SDK for instant DuckDuckGo searches."
license = "MIT"
homepage = "https://github.com/wiseaidotdev/duckduckgo"
documentation = "https://docs.rs/duckduckgo"
repository = "https://github.com/wiseaidotdev/duckduckgo"
keywords = ["cli", "duckduckgo", "search", "dorks", "api"]
categories = [
    "command-line-utilities",
    "network-programming",
    "web-programming::http-client",
    "text-processing",
    "accessibility",
]
exclude = [
    "/tests",
    ".*",
    "/python",
    "/bin",
    "/assets",
    "/debian",
    "/rpm",
    "NODE.md",
    "PYTHON.md",
    "DOCKER.md",
    "Dockerfile",
    "PACKAGING.md",
    "CLI.md",
    "package.json",
    "package-lock.json",
    "pyproject.toml",
]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ddg"
path = "src/bin/main.rs"
required-features = ["rust-binary"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"], optional = true }
tokio = { version = "1.52.3", features = ["full"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
phf = { version = "0.13.1", features = ["macros"] }
chrono = "0.4.44"
scraper = "0.27.0"
anyhow = "1.0.102"
regex = "1.12.3"
urlencoding = "2.1.3"
serde_json = "1.0.149"
pyo3 = { version = "0.28.3", features = ["extension-module"], optional = true }
napi = { version = "3.9.0", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "3.5.6", optional = true }
ratatui = { version = "0.30.0", features = ["crossterm"], optional = true }
tui-input = { version = "0.15.3", optional = true }
crossterm = { version = "0.29.0", optional = true }
strum = { version = "0.28.0", features = ["derive"], optional = true }
strum_macros = { version = "0.28.0", optional = true }
ratatui-image = { version = "11.0.2", default-features = false, features = ["crossterm", "image-defaults"], optional = true }
html2text = { version = "0.17.1", optional = true }
image = { version = "0.25.10", optional = true }
emojis = { version = "0.8.2", optional = true }
url = { version = "2.5.8", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.4", features = ["cookies", "json", "query"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["json", "query"] }
chrono = { version = "0.4.44", features = ["wasmbind"] }

[build-dependencies]
napi-build = { version = "2.3.1", optional = true }

[dev-dependencies]
tokio = { version = "1.45.1", features = ["full"] }
yew = { version = "0.23.0", features = ["csr"] }

[features]
default = []
rust-binary = ["cli", "tui"]
cli = ["clap", "tokio"]
tui = [
    "url",
    "cli",
    "strum",
    "image",
    "emojis",
    "ratatui",
    "tui-input",
    "html2text",
    "crossterm",
    "strum_macros",
    "ratatui-image"
]

python = ["pyo3", "cli"]
node = ["napi", "napi-derive", "napi-build", "cli"]

[profile.release]
opt-level = "z"
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[badges]
maintenance = { status = "actively-developed" }
